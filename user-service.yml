spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/ecommerce_user_db
    username: root
    password: ${DB_PASSWORD:test@12345}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

security:
  jwt:
    # Development-only key. Replace with a securely generated Base64 key.
    secret: ${JWT_SECRET:VGhpc0lzQURldmVsb3BtZW50T25seVNlY3JldEtleUZvcldhbGdyZWVuczEyMzQ1Njc4OTA=}
    expiration-ms: 900000

